name: CI

# Checks every pull request and every push to main: the safety net for outside contributions.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows: the only target, and the native modules (better-sqlite3, node-llama-cpp) are tested as shipped.
    runs-on: windows-latest
    steps:
      # Same pinned actions as release.yml (commit hashes, not movable tags).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # No personal data in the repository; the maintainers' own strings come from a secret, never from the code.
      - run: npm run check:personal-data
        env:
          RECV_PRIVATE_PATTERNS: ${{ secrets.RECV_PRIVATE_PATTERNS }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

      # Known advisories without an upstream fix (see docs/audit/AUDIT.md, SEC-03): reported, not blocking.
      - name: Dependency audit
        run: npm audit --omit=dev
        continue-on-error: true
