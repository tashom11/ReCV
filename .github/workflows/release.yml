name: Release

# Build et publie l'installeur Windows sur la release GitHub du tag `v*` (ex. v0.2.0).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # Actions épinglées par empreinte de commit (et non par tag modifiable).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Vérifier que le tag correspond à la version du package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à package.json (v$version)" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

      # --- Sans signature (par défaut) ---------------------------------------------------------
      # Tant que la variable de dépôt SIGNPATH_ORGANIZATION_ID n'existe pas, l'installeur est publié tel quel :
      # Windows SmartScreen affiche un avertissement à la première installation.
      # La release est créée une seule fois, en brouillon, avant l'envoi : electron-builder envoie ses fichiers en
      # parallèle et, sans release existante, en crée parfois deux pour le même tag (v0.2.0 : l'installeur et
      # latest.yml d'un côté, le .blockmap de l'autre, et des liens de téléchargement en 404).
      - name: Créer la release en brouillon
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Packager et envoyer (non signé)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier la release
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
        shell: bash
        run: |
          fichiers="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          echo "$fichiers"
          echo "$fichiers" | grep -qx 'latest.yml' || { echo "latest.yml absent de la release" >&2; exit 1; }
          echo "$fichiers" | grep -q '\.exe$' || { echo "Installeur absent de la release" >&2; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # --- Avec signature (SignPath, gratuit pour l'open source : https://signpath.org) ----------
      # S'active dès que le projet est accepté par SignPath et que le dépôt contient :
      #   - la variable SIGNPATH_ORGANIZATION_ID ;
      #   - le secret SIGNPATH_API_TOKEN ;
      #   - côté SignPath, le projet « recv » et la politique de signature « release-signing ».
      - name: Packager (à signer)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: npx electron-builder --win --publish never

      - name: Déposer l'installeur à signer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: installeur
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installeur
          path: release/*.exe
          if-no-files-found: error

      - name: Signer l'installeur
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: recv
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.installeur.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release-signe

      # La signature change le fichier : latest.yml (lu par la mise à jour automatique) est recalculé sur le fichier signé.
      - name: Publier l'installeur signé
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/latest-yml.mjs "release-signe/ReCV-Setup-$version.exe" "$version"
          gh release create "$GITHUB_REF_NAME" "release-signe/ReCV-Setup-$version.exe" release-signe/latest.yml \
            --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
