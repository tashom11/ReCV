name: Release

# Build et publie l'installeur Windows sur la release GitHub du tag `v*` (ex. v0.2.0).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # Actions épinglées par empreinte de commit (et non par tag modifiable).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Vérifier que le tag correspond à la version du package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à package.json (v$version)" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

      # --- Signature (désactivée pour l'instant) ---------------------------------------------
      # Quand le projet sera accepté sur SignPath (https://signpath.org, gratuit pour l'open source) :
      #   1. Publier l'installeur non signé comme artefact de workflow :
      #        - run: npx electron-builder --win --publish never
      #        - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      #          id: installeur
      #          with: { name: installeur, path: release/*.exe }
      #   2. Le faire signer :
      #        - uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
      #          with:
      #            api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #            organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      #            project-slug: recv
      #            signing-policy-slug: release-signing
      #            github-artifact-id: ${{ steps.installeur.outputs.artifact-id }}
      #            wait-for-completion: true
      #            output-artifact-directory: release-signe
      #   3. Publier le fichier signé (et son latest.yml régénéré) sur la release.
      # ---------------------------------------------------------------------------------------

      - name: Packager et publier
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
