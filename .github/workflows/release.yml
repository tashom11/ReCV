name: Release

# Builds the Windows installer and publishes it on the GitHub release of the `v*` tag (e.g. v0.2.0).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # Actions pinned by commit hash (not by a movable tag).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches the package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json (v$version)" >&2
            exit 1
          fi

      # Release notes: the CHANGELOG.md section of this version (no section, no release).
      - name: Release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
        shell: bash

      - run: npm ci
      - run: npm run check:personal-data
        env:
          RECV_PRIVATE_PATTERNS: ${{ secrets.RECV_PRIVATE_PATTERNS }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

      # --- Unsigned (default) -------------------------------------------------------------------
      # As long as the repository variable SIGNPATH_ORGANIZATION_ID does not exist, the installer is published as is:
      # Windows SmartScreen shows a warning on first install.
      # The release is created once, as a draft, before the upload: electron-builder uploads its files in parallel and,
      # without an existing release, sometimes creates two for the same tag (v0.2.0: the installer and latest.yml on
      # one, the .blockmap on the other, and download links returning 404).
      - name: Create the draft release
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Package and upload (unsigned)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
        shell: bash
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          echo "$assets"
          echo "$assets" | grep -qx 'latest.yml' || { echo "latest.yml missing from the release" >&2; exit 1; }
          echo "$assets" | grep -q '\.exe$' || { echo "Installer missing from the release" >&2; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # --- Signed (SignPath, free for open source: https://signpath.org) ------------------------
      # Enabled once the project is accepted by SignPath and the repository has:
      #   - the variable SIGNPATH_ORGANIZATION_ID;
      #   - the secret SIGNPATH_API_TOKEN;
      #   - on SignPath, the project "recv" and the signing policy "release-signing".
      - name: Package (to sign)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: npx electron-builder --win --publish never

      - name: Upload the installer to sign
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer
          path: release/*.exe
          if-no-files-found: error

      - name: Sign the installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: recv
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release-signed

      # Signing changes the file: latest.yml (read by the auto-updater) is computed again on the signed file.
      - name: Publish the signed installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/latest-yml.mjs "release-signed/ReCV-Setup-$version.exe" "$version"
          gh release create "$GITHUB_REF_NAME" "release-signed/ReCV-Setup-$version.exe" release-signed/latest.yml \
            --title "${GITHUB_REF_NAME#v}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
