# ⚠️ No ":" in productName/artifactName (forbidden in Windows file names, and Electron derives the userData folder
# from productName). The displayed name "Re:CV" only lives in the interface titles.
appId: org.recv.app
productName: ReCV
copyright: Re:CV contributors

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  # The installer targets x64 only: the ARM binaries of the local engine are never loaded.
  - "!node_modules/@node-llama-cpp/win-arm64/**"

# Native modules and binaries: they must stay outside the asar archive to be loaded.
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/node-llama-cpp/**
  - node_modules/@node-llama-cpp/**

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ReCV-Setup-${version}.${ext}
  # Signing: done by .github/workflows/release.yml (SignPath) once the repository is set up for it.
  # With a certificate of our own, `signtoolOptions` would go here instead.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # The uninstaller asks whether to delete the data (build/installer.nsh), "No" by default.
  deleteAppDataOnUninstall: false
  shortcutName: ReCV

# Electron fuses harden the shipped binary (no use as a Node interpreter, no inspector, app loaded only from the
# verified asar).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# Updates: electron-updater reads the GitHub releases of this repository.
publish:
  provider: github
  owner: tashom11
  repo: ReCV
  # Draft: the workflow creates the release, uploads the files to it, then publishes it once complete.
  releaseType: draft
